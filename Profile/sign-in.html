<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <link rel="stylesheet" href="../Home/style/form.css">
    <script src="../Home/js/i18n.js" defer></script>
    <script src="../Home/js/screenreader.js" defer></script>
    <script src="../Home/js/auth.js" defer></script>
</head>

<body class="sign-in-page">
<div class="lang-mini"><a href="?lang=en" data-lang="en">EN</a><a href="?lang=ny" data-lang="ny">NY</a><a href="?lang=bem" data-lang="bem">BEM</a></div>

    <div class="form-box">

        <h2 data-i18n="signin">Sign In</h2>

        <p class="form-status" data-auth-required role="status" aria-live="polite" hidden>Please sign in or sign up to view this product.</p>

        <form method="post" action="../api/auth.php" data-auth-form="signin">

            <input type="hidden" name="action" value="signin">
            <input type="email" name="email" autocomplete="email" placeholder="Email" data-i18n-ph="email" required>

            <div class="password-box">
                <input type="password" name="password" autocomplete="current-password" placeholder="Password" data-i18n-ph="password" minlength="8" maxlength="72" required>
                <button type="button" class="password-toggle" data-password-toggle aria-label="Show password">Show</button>
            </div>

            <p class="form-status" data-auth-status role="status" aria-live="polite" hidden></p>

            <button type="submit" data-i18n="signin">Sign In</button>

            <p class="account">
                <span data-i18n="noacct">Don't have an account?</span>
                <a href="sign-out.html" data-auth-switch data-i18n="signup">Sign Up</a>
            </p>

        </form>

    </div>

</body>
</html>
